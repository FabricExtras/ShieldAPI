architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // EMI: the loader-agnostic, intermediary-mapped artifact. Remapping the platform
    // `emi-fabric` jar inside the fabric-api-less `:common` module half-remaps it and
    // poisons the shared cross-subproject Loom cache. No `:api` classifier here --
    // ShieldAPIEmiPlugin uses `dev.emi.emi.recipe.EmiAnvilRecipe`, an impl class.
    modCompileOnly "dev.emi:emi-xplat-intermediary:$rootProject.emi_version"
}
